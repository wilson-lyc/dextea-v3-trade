server:
  port: 9090

spring:
  application:
    name: dextea-trade
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  nacos:
    config:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dextea}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

cosid:
  namespace: ${spring.application.name}
  machine:
    enabled: true
    distributor:
      type: redis
  snowflake:
    enabled: true
    # 命名生成器：按业务分配。后续新增 ID 类型（退款单号、流水号等）只需在此追加条目，
    # 代码中通过 IdGeneratorProvider.getRequired(name) 获取，无需改动生成器实现。
    provider:
      order:
        namespace: ${spring.application.name}

alipay:
  server-url: https://openapi.alipay.com
  subject: 德贤茶庄订单
  product-code: JSAPI_PAY
  # 开发环境：创建支付宝交易时强制将订单总额限制为 0.01 元，避免产生真实交易金额。
  # 生产环境（Nacos 配置）应将其置空（alipay.force-amount:）以使用真实金额。
  force-amount: 0.01

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.dextea.trade.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /docs/json
  swagger-ui:
    enabled: true
    path: /docs/ui
    disable-swagger-default-url: true
  packages-to-scan: cn.dextea.trade.controller
  paths-to-match: /api/**
