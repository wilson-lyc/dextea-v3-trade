server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dextea-trade}
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  nacos:
    config:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
    discovery:
      enabled: ${NACOS_DISCOVERY_ENABLED:false}
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      service: ${SPRING_APPLICATION_NAME:dextea-trade}
      group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
      register-enabled: ${NACOS_DISCOVERY_REGISTER_ENABLED:true}
      ip: ${NACOS_DISCOVERY_IP:}
      port: ${SERVER_PORT:9090}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dextea}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

cosid:
  namespace: ${COSID_NAMESPACE:${spring.application.name}}
  machine:
    enabled: ${COSID_MACHINE_ENABLED:true}
    distributor:
      type: ${COSID_MACHINE_DISTRIBUTOR_TYPE:redis}
  snowflake:
    enabled: ${COSID_SNOWFLAKE_ENABLED:true}
    provider:
      order:
        namespace: ${COSID_SNOWFLAKE_PROVIDER_ORDER_NAMESPACE:${spring.application.name}}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.dextea.trade.order.domain.model,cn.dextea.trade.order.infrastructure.gateway.po,cn.dextea.trade.order.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /docs/json
  swagger-ui:
    enabled: true
    path: /docs/ui
    disable-swagger-default-url: true
  packages-to-scan: cn.dextea.trade.order.interfaces.http.controller,cn.dextea.trade.console.interfaces.http.controller
  paths-to-match: /api/**,/console/**

auth:
  enabled: ${AUTH_ENABLED:false}
  console:
    username: ${AUTH_CONSOLE_USERNAME:admin}
    password: ${AUTH_CONSOLE_PASSWORD:admin}

order:
  payment_ttl: ${ORDER_PAYMENT_TTL:15}
  create_order_idem_ttl: ${ORDER_CREATE_ORDER_IDEM_TTL:1440}
  order_item_cache_ttl: ${ORDER_ITEM_CACHE_TTL:120}

alipay:
  server-url: ${ALIPAY_GATEWAY:https://openapi.alipay.com}
  app-id: ${ALIPAY_APP_ID}
  private-key: ${ALIPAY_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY}
  subject: ${ALIPAY_SUBJECT:dextea-order}
  force-amount: ${ALIPAY_FORCE_AMOUNT:}
  notify-url: ${ALIPAY_NOTIFY_URL}

payment-callback-mq:
  enabled: ${PAYMENT_CALLBACK_MQ_ENABLED:false}
  endpoints: ${PAYMENT_CALLBACK_MQ_ENDPOINTS}
  namespace: ${PAYMENT_CALLBACK_MQ_NAMESPACE:}
  access-key: ${PAYMENT_CALLBACK_MQ_ACCESS_KEY:}
  secret-key: ${PAYMENT_CALLBACK_MQ_SECRET_KEY:}
  topic: ${PAYMENT_CALLBACK_MQ_TOPIC:payment_callback}
  consumer-group: ${PAYMENT_CALLBACK_MQ_CONSUMER_GROUP:payment_callback}
  tag: ${PAYMENT_CALLBACK_MQ_TAG:*}

order-making-mq:
  enabled: ${ORDER_MAKING_MQ_ENABLED:false}
  endpoints: ${ORDER_MAKING_MQ_ENDPOINTS}
  namespace: ${ORDER_MAKING_MQ_NAMESPACE:}
  access-key: ${ORDER_MAKING_MQ_ACCESS_KEY:}
  secret-key: ${ORDER_MAKING_MQ_SECRET_KEY:}
  topic: ${ORDER_MAKING_MQ_TOPIC:order_making_status}

order-timeout-mq:
  enabled: ${ORDER_TIMEOUT_MQ_ENABLED:false}
  endpoints: ${ORDER_TIMEOUT_MQ_ENDPOINTS}
  namespace: ${ORDER_TIMEOUT_MQ_NAMESPACE:}
  access-key: ${ORDER_TIMEOUT_MQ_ACCESS_KEY:}
  secret-key: ${ORDER_TIMEOUT_MQ_SECRET_KEY:}
  topic: ${ORDER_TIMEOUT_MQ_TOPIC:order_timeout}
  consumer-group: ${ORDER_TIMEOUT_MQ_CONSUMER_GROUP:order_timeout}
  delay-minutes: ${ORDER_TIMEOUT_MQ_DELAY_MINUTES:16}

otel:
  enabled: ${OTEL_ENABLED:true}
  logs-export-enabled: ${OTEL_LOGS_EXPORTER_ENABLED:true}