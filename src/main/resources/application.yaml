server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dextea-trade}
  config:
    import:
      - optional:nacos:${spring.application.name}.yaml?group=${NACOS_CONFIG_GROUP:DEFAULT_GROUP}
  nacos:
    config:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dextea}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

cosid:
  namespace: ${COSID_NAMESPACE:${spring.application.name}}
  machine:
    enabled: ${COSID_MACHINE_ENABLED:true}
    distributor:
      type: ${COSID_MACHINE_DISTRIBUTOR_TYPE:redis}
  snowflake:
    enabled: ${COSID_SNOWFLAKE_ENABLED:true}
    provider:
      order:
        namespace: ${COSID_SNOWFLAKE_PROVIDER_ORDER_NAMESPACE:${spring.application.name}}

alipay:
  gateway: ${ALIPAY_GATEWAY:https://openapi.alipay.com}
  app-id: ${ALIPAY_APP_ID}
  private-key: ${ALIPAY_PRIVATE_KEY}
  public-key: ${ALIPAY_PUBLIC_KEY}
  subject: ${ALIPAY_SUBJECT:dextea-order}
  force-amount: ${ALIPAY_FORCE_AMOUNT:}
  notify-url: ${ALIPAY_NOTIFY_URL:}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.dextea.trade.entity
  configuration:
    map-underscore-to-camel-case: true

rocketmq:
  endpoints: ${ROCKETMQ_ENDPOINTS}
  topic: ${ROCKETMQ_TOPIC}
  consumer-group: ${ROCKETMQ_CONSUMER_GROUP}
  tag: ${ROCKETMQ_TAG:*}
  namespace: ${ROCKETMQ_NAMESPACE:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}

springdoc:
  api-docs:
    enabled: true
    path: /docs/json
  swagger-ui:
    enabled: true
    path: /docs/ui
    disable-swagger-default-url: true
  packages-to-scan: cn.dextea.trade.controller
  paths-to-match: /api/**
