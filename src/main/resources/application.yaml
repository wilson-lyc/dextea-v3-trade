server:
  port: 9090

spring:
  application:
    name: dextea-trade
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dextea}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

cosid:
  namespace: ${spring.application.name}
  machine:
    enabled: true
    distributor:
      type: redis
  snowflake:
    enabled: true

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.dextea.trade.entity
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /docs/json
  swagger-ui:
    enabled: true
    path: /docs/ui
    disable-swagger-default-url: true
  packages-to-scan: cn.dextea.trade.controller
  paths-to-match: /api/**
