server:
  port: ${SERVER_PORT:9090}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:dextea-trade}
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR}
        namespace: ${NACOS_NAMESPACE:}
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        group: ${NACOS_DISCOVERY_GROUP:DEFAULT_GROUP}
        cluster-name: ${NACOS_DISCOVERY_CLUSTER:DEFAULT}
        ip: ${NACOS_DISCOVERY_IP:}
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

cosid:
  namespace: ${COSID_NAMESPACE:${spring.application.name}}
  machine:
    enabled: ${COSID_MACHINE_ENABLED:true}
    distributor:
      type: ${COSID_MACHINE_DISTRIBUTOR_TYPE:redis}
  snowflake:
    enabled: ${COSID_SNOWFLAKE_ENABLED:true}
    provider:
      order:
        namespace: ${COSID_SNOWFLAKE_PROVIDER_ORDER_NAMESPACE:${spring.application.name}}

mybatis:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: cn.dextea.trade.order.domain.model,cn.dextea.trade.order.infrastructure.gateway.po,cn.dextea.trade.order.infrastructure.persistence.po
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  api-docs:
    enabled: true
    path: /docs/json
  swagger-ui:
    enabled: true
    path: /docs/ui
    disable-swagger-default-url: true
  packages-to-scan: cn.dextea.trade.order.interfaces.http.controller
  paths-to-match: /api/**

auth:
  enabled: ${AUTH_ENABLED:true}
  tokens: ${AUTH_TOKENS:}

order:
  payment_ttl: ${ORDER_PAYMENT_TTL:15}
  create_order_idem_ttl: ${ORDER_CREATE_ORDER_IDEM_TTL:1440}
  order_item_cache_ttl: ${ORDER_ITEM_CACHE_TTL:120}

alipay:
  server-url: ${ALIPAY_GATEWAY:https://openapi.alipay.com}
  app-id: ${ALIPAY_APP_ID}
  private-key: ${ALIPAY_PRIVATE_KEY}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY}
  subject: ${ALIPAY_SUBJECT:dextea-order}
  force-amount: ${ALIPAY_FORCE_AMOUNT:}
  notify-url: ${ALIPAY_NOTIFY_URL}

rocketmq:
  enabled: ${ROCKETMQ_ENABLED:true}
  endpoints: ${ROCKETMQ_ENDPOINTS}
  namespace: ${ROCKETMQ_NAMESPACE:}
  access-key: ${ROCKETMQ_ACCESS_KEY:}
  secret-key: ${ROCKETMQ_SECRET_KEY:}
  payment-callback-mq:
    enabled: ${PAYMENT_CALLBACK_MQ_ENABLED:false}
    topic: ${PAYMENT_CALLBACK_MQ_TOPIC:payment_callback}
    consumer-group: ${PAYMENT_CALLBACK_MQ_CONSUMER_GROUP:payment_callback}
    tag: ${PAYMENT_CALLBACK_MQ_TAG:*}
  order-making-mq:
    enabled: ${ORDER_MAKING_MQ_ENABLED:false}
    topic: ${ORDER_MAKING_MQ_TOPIC:order_making_status}
  order-timeout-mq:
    enabled: ${ORDER_TIMEOUT_MQ_ENABLED:false}
    topic: ${ORDER_TIMEOUT_MQ_TOPIC:order_timeout}
    consumer-group: ${ORDER_TIMEOUT_MQ_CONSUMER_GROUP:order_timeout}
    delay-minutes: ${ORDER_TIMEOUT_MQ_DELAY_MINUTES:16}