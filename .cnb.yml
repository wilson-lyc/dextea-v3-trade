$:
  vscode:
    - runner:
        cpus: 2
      docker:
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        # 进入开发环境前自动完成 Java 环境配置
        - name: setup-java
          script: |
            set -e
            JDK_HOME="$HOME/.jdks/zulu21"

            # 已安装则跳过下载
            if [ ! -x "$JDK_HOME/bin/java" ]; then
              install_unzip() {
                if command -v apt-get >/dev/null 2>&1; then
                  (command -v sudo >/dev/null 2>&1 && sudo apt-get update -qq && sudo apt-get install -y unzip) || (apt-get update -qq && apt-get install -y unzip)
                elif command -v yum >/dev/null 2>&1; then
                  (command -v sudo >/dev/null 2>&1 && sudo yum install -y unzip) || yum install -y unzip
                fi
              }
              command -v unzip >/dev/null 2>&1 || install_unzip

              curl -fSL "https://cdn.azul.com/zulu/bin/zulu21.52.15-ca-jdk21.0.12-linux_x64.zip" -o /tmp/zulu21.zip
              mkdir -p /tmp/zulu21_extract "$JDK_HOME"
              unzip -q /tmp/zulu21.zip -d /tmp/zulu21_extract
              cp -r /tmp/zulu21_extract/zulu21.52.15-ca-jdk21.0.12-linux_x64/. "$JDK_HOME"/
              rm -rf /tmp/zulu21.zip /tmp/zulu21_extract
            fi

            export JAVA_HOME="$JDK_HOME"
            export PATH="$JAVA_HOME/bin:$PATH"

            # 持久化到 shell 配置，使 VSCode 终端也能识别
            for f in "$HOME/.bashrc" "$HOME/.zshrc" "$HOME/.profile"; do
              if [ -f "$f" ] && ! grep -q "JAVA_HOME=$JDK_HOME" "$f"; then
                printf '\nexport JAVA_HOME=%s\nexport PATH="$JAVA_HOME/bin:$PATH"\n' "$JDK_HOME" >> "$f"
              fi
            done

            echo "=== Java 环境自检 ==="
            JAVA_BIN="$JAVA_HOME/bin/java"
            JAVAC_BIN="$JAVA_HOME/bin/javac"
            # 1. java 与 javac 均可用（确认是 JDK 而非 JRE）
            "$JAVA_BIN" -version
            "$JAVAC_BIN" -version
            # 2. JAVA_HOME 指向的 java 与 PATH 中命中的 java 一致
            EXPECTED="$("$JAVA_BIN" -XshowSettings:properties -version 2>&1 | grep -i '^    java.home' | awk -F'= ' '{print $2}')"
            if [ "$EXPECTED" = "$JAVA_HOME" ]; then
              echo "JAVA_HOME 一致性校验 OK ($JAVA_HOME)"
            else
              echo "JAVA_HOME 不一致：期望 $JAVA_HOME，实际 $EXPECTED" >&2
              exit 1
            fi
            # 3. 若有 Maven Wrapper 则验证可被识别（不触发下载）
            if [ -x ./mvnw ]; then
              ./mvnw -v || echo "提示：mvnw 执行异常，请检查网络或 Maven 配置"
            fi
            echo "Java 环境自检通过 ✅"
        # 等待上述任务完成后再进入开发环境
        - name: enter dev env
          type: vscode:go
